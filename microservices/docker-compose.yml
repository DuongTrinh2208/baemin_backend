version: '3.8'
services:
  api-gate-way:
    container_name: api-gate-way
    build: ./api-gate-way
    ports:
      - 8080:8080
    networks:
      - node-network

  order-service:
    container_name: order-service
    build: ./order-service
    environment:
      - DATABASE_URL=postgresql://postgres:1234@some-postgres:5432/db_baemin
    networks:
      - node-network

  payment-service:
    container_name: payment-service
    build: ./payment-service
    environment:
      - DATABASE_URL=postgresql://postgres:1234@some-postgres:5432/db_baemin
    networks:
      - node-network

  product-service:
    container_name: product-service
    build: ./product-service
    environment:
      - DATABASE_URL=postgresql://postgres:1234@some-postgres:5432/db_baemin
      - REDIS_HOST=some-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=1234
      - REDIS_TTL=3600
      - ELASTIC_NODE=https://elasticsearch:9200
      - ELASTIC_USER=elastic
      - ELASTIC_PASS=I7RJbcs++X5h28YEocMQ
    networks:
      - node-network

  user-service:
    container_name: user-service
    build: ./user-service
    environment:
      - DATABASE_URL=postgresql://postgres:1234@some-postgres:5432/db_baemin
    networks:
      - node-network

networks:
  node-network:
    external: true
    